<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My2050 Carbon Calculator</title>
    <meta name="description" content="Explore illustrative UK carbon pathway scores across 15 policy levers. Independent education tool; not an official energy-system forecast." />

    <!-- Prevent dark mode flash -->
    <script>
      (function() {
        var t = null;
        try {t = localStorage.getItem('my2050-theme');} catch (e) { /* optional */ }
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="My2050 Carbon Calculator" />
    <meta property="og:description" content="Create your pathway to a low carbon UK by 2050. Find the right mix of policies to reach Net Zero." />
    <meta property="og:url" content="https://agawane.com/" />
    <link rel="canonical" href="https://agawane.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="My2050 Carbon Calculator" />
    <meta name="twitter:description" content="Create your pathway to a low carbon UK by 2050." />

    <!-- Theme color -->
    <meta name="theme-color" content="#87CEEB" />
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
