# My2050 Carbon Calculator - Nixpacks build config (Coolify)
# The app lives in the app/ subdirectory; this config points the build there.
# Node 22 is pinned because Vite 7 requires Node >= 20.19.
providers = ['node']

[phases.setup]
nixPkgs = ['nodejs_22']

[phases.install]
cmds = ['cd app && npm ci']
cacheDirectories = ['/root/.npm']
paths = ['/app/app/node_modules/.bin']

[phases.build]
cmds = ['cd app && npm run build']
cacheDirectories = ['app/node_modules/.cache']
paths = ['/app/app/node_modules/.bin']

[start]
cmd = 'cd app && npm run preview'
